[project]
name = "lora-finetune-studio"
version = "0.5.0"
description = "Local Streamlit studio for parameter-efficient LLM post-training"
readme = "README.md"
authors = [
    { name = "Ahmad Mujtaba", email = "72138709+pypi-ahmad@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate>=1.12,<2",
    "bitsandbytes>=0.49,<1",
    "datasets>=4,<5",
    "huggingface-hub>=1.3,<2",
    "peft>=0.18,<1",
    "psutil>=7,<8",
    "streamlit>=1.57,<2",
    "torch>=2.4",
    "transformers>=4.57,<6",
    "trl>=0.27,<1",
]

[project.scripts]
lora-finetune-studio = "lora_finetune_studio.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "ty>=0.0.19,<1",
]
docs = [
    "beautifulsoup4>=4.13,<5",
    "markdown>=3.8,<4",
    "pypdf>=6,<7",
    "reportlab>=4.4,<5",
]
